name: Release Moonfin-Auto

# Builds the phone APK and publishes it as a GitHub Release on this fork.
# Runs on every push to main, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-moonfin-auto
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_* signing secrets are missing. Add them under Settings > Secrets and variables > Actions so every release can update the last one."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<PROPS
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          keytool -list -keystore android/app/release.keystore -storetype "$STORE_TYPE" -storepass "$STORE_PASSWORD" >/dev/null

      - name: Work out the version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          # A fourth number counts this fork's releases, so the in-app updater
          # sees each one as newer. The version code only ever goes up.
          NAME="$BASE.${{ github.run_number }}"
          CODE=$((40000000 + ${{ github.run_number }}))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Moonfin-Auto $NAME ($CODE)"

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --flavor mobile \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}" \
            --dart-define=DISTRIBUTION_CHANNEL=apk
          cp build/app/outputs/flutter-apk/app-mobile-release.apk \
            "Moonfin-Auto_v${{ steps.version.outputs.name }}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Moonfin-Auto ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Moonfin-Auto_v*.apk
          body: |
            Moonfin-Auto for Android phones, built from ${{ github.sha }}.

            Download the APK below and open it on your phone to install or update.
